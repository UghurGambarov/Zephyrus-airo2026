[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zephyrus-city-trap-backend"
version = "1.0.0"
description = "AI-assisted cyber-threat detection for smart-city infrastructure (backend)."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "scikit-learn==1.6.1",
    "numpy==2.2.1",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
llm = ["anthropic==0.43.0"]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
    "ruff==0.8.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
# Wider than usual to accommodate embedded localized (Azerbaijani) data tables.
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
